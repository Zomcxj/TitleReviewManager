version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: titleadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: titleservice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titleadmin -d titleservice"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://titleadmin:changeme@db:5432/titleservice
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      STORAGE_BACKEND: local
      NAS_ROOT: /data/nas
    volumes:
      - nas_data:/data/nas
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
  nas_data:
